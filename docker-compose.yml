version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ridewala-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ridewala
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridewala-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ridewala
      JWT_SECRET: ridewala_docker_jwt_secret_key_2024
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongodb

volumes:
  mongo_data:

